<body>

<!-- Fondo decorativo. Va por detrás de todo, no recibe clics y no lo lee nadie: si el
     lienzo no llega a pintarse, queda el color de fondo de siempre. -->
<div class="fons" id="fons" aria-hidden="true">
  <canvas class="fons__llenc" id="fons-llenc"></canvas>
  <div class="fons__gra" id="fons-gra"></div>
</div>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 17 17 7"/><path d="M8 7h9v9"/>
  </symbol>
  <symbol id="i-github" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 2-2.64-.5-5.36-.5-8 0-2-2-3-2-3-2-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
    <path d="M9 18c-4.51 2-5-2-7-2"/>
  </symbol>
  <symbol id="i-linkedin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-10h4v1.8A6 6 0 0 1 16 8z"/>
    <rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>
  </symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 8.97 5.7a2 2 0 0 0 2.06 0L22 7"/>
  </symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>
  </symbol>

  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="m9 12 2 2 4-4"/>
  </symbol>

  <!-- Banderas dibujadas a mano: Windows no pinta los emoji de bandera y la senyera ni siquiera existe como emoji. -->
  <symbol id="f-es" viewBox="0 0 24 16">
    <path fill="#C60B1E" d="M0 0h24v16H0z"/>
    <path fill="#FFC400" d="M0 4h24v8H0z"/>
  </symbol>
  <symbol id="f-ca" viewBox="0 0 24 16">
    <path fill="#FCDD09" d="M0 0h24v16H0z"/>
    <g fill="#DA121A">
      <path d="M0 1.778h24v1.778H0z"/>
      <path d="M0 5.333h24v1.778H0z"/>
      <path d="M0 8.889h24v1.778H0z"/>
      <path d="M0 12.444h24v1.778H0z"/>
    </g>
  </symbol>
  <symbol id="f-gb" viewBox="0 0 24 16">
    <clipPath id="f-gb-quarters">
      <path d="M12 8 24 8 24 16Z M12 8 12 16 0 16Z M12 8 0 8 0 0Z M12 8 12 0 24 0Z"/>
    </clipPath>
    <path fill="#012169" d="M0 0h24v16H0z"/>
    <g fill="none">
      <path stroke="#FFFFFF" stroke-width="3.2" d="M0 0 24 16M24 0 0 16"/>
      <path stroke="#C8102E" stroke-width="1.6" clip-path="url(#f-gb-quarters)" d="M0 0 24 16M24 0 0 16"/>
      <path stroke="#FFFFFF" stroke-width="5.333" d="M12 0v16M0 8h24"/>
      <path stroke="#C8102E" stroke-width="3.2" d="M12 0v16M0 8h24"/>
    </g>
  </symbol>
</svg>

<!-- Pantalla de acceso. Es lo único que trae el HTML: el portafolio entero lo monta
     script.js cuando la API confirma quién entra, así que no está escrito aquí. -->
<div class="porta" id="porta">
  <div class="porta__barra">
    <div class="lang" role="group" aria-label="Idioma" data-i18n-aria-label="lang.aria">
      <button class="lang__btn" type="button" data-lang="es" aria-pressed="true">
        <svg class="flag" aria-hidden="true" focusable="false"><use href="#f-es"/></svg>
        <span>Castellano</span>
      </button>
      <button class="lang__btn" type="button" data-lang="ca" aria-pressed="false">
        <svg class="flag" aria-hidden="true" focusable="false"><use href="#f-ca"/></svg>
        <span>Català</span>
      </button>
      <button class="lang__btn" type="button" data-lang="en" aria-pressed="false">
        <svg class="flag" aria-hidden="true" focusable="false"><use href="#f-gb"/></svg>
        <span>English</span>
      </button>
    </div>
  </div>

  <div class="porta__centre">
    <div class="porta__card">
      <div class="porta__dalt">
        <p class="eyebrow" data-i18n="porta.eyebrow">Portafolio</p>
        <h1 class="porta__nom">Alex Aiguadé Alisultánov</h1>
        <p class="porta__titular" data-i18n="porta.titular">Técnico IT · Sistemas · Ciberseguridad</p>
      </div>

      <form class="porta__form" id="porta-form" novalidate>
        <!-- La cuenta de invitado viene puesta, contraseña incluida: entrar es pulsar el
             botón. Que esa contraseña esté a la vista da igual, solo abre la visita. La
             de administrador no está aquí y la comprueba el servidor. Si alguien tiene
             otra cuenta guardada, el gestor del navegador pisa estos valores. -->
        <div class="camp">
          <label for="porta-usuari" data-i18n="porta.user">Usuario</label>
          <input id="porta-usuari" name="usuario" type="text" value="invitado"
                 autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <div class="camp">
          <label for="porta-clau" data-i18n="porta.pass">Contraseña</label>
          <input id="porta-clau" name="contrasena" type="password" value="plebeyo1234"
                 autocomplete="current-password">
        </div>

        <p class="porta__avis" id="porta-avis" role="alert" hidden></p>

        <!-- El texto del botón y el de la pista los pone script.js, porque cambian
             según cómo vaya la petición. -->
        <button class="btn btn--primary porta__boto" type="submit" id="porta-entrar">Entrar</button>

        <p class="porta__pista" id="porta-pista" role="status" hidden>
          <span class="porta__punt" aria-hidden="true"></span>
          <span class="porta__pista-text"></span>
        </p>
      </form>

      <noscript>
        <style>.porta__form { display: none; }</style>
        <p class="porta__sensejs">Esta página necesita JavaScript para entrar y para mostrar el contenido. Actívalo y vuelve a cargarla.</p>
      </noscript>
    </div>

    <p class="porta__nota" data-i18n="porta.nota">Entra como invitado, ya está todo puesto.</p>
  </div>
</div>

<div id="app" hidden></div>

<script src="script.js?v=202609240030" defer></script>
</body>
</html>
